<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header>
      <div class="profile-header">
        <img src="./src/img/banner.jpeg" alt="" class="profile-banner" />

        <img src="./src/img/profile.jpeg" alt="" class="profile-img" />
      </div>

      <div class="profile-info">
        <div class="profile-title">
          <span class="profile-username">/leonardolyrio</span>
          <h1 class="profile-name">Leonardo Lyrio</h1>
        </div>

        <ul class="profile-bio">
          <li>desenvolvedor frontend 👨‍💻</li>
          <li>interfaces & desenvolvimento web 🎯</li>
          <li>projetos, automações & tecnologia ⚙️</li>
        </ul>
      </div>

      <div class="profile-socials">
        <a href="https://wa.me/5527974008334" target="_blank">
          <img
            src="./src/svg/alternate_email_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
          />
          Contato
        </a>

        <a href="https://leonardolyrio.vercel.app" target="_blank">
          <img
            src="./src/svg/link_2_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
            alt=""
          />
          Site
        </a>
      </div>
    </header>

    <main>
      <section class="latest-projects">
        <h2>Projetos recentes</h2>
        <div class="projects-grid">
          <div class="card">
            <img src="./src/img/burger_king_website.png" alt="" class="card-img" />
            <a
              href="https://burgerking-rho.vercel.app/"
              target="_blank"
              class="card-button"
              ><img
                src="./src/svg/arrow_outward_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
            /></a>
          </div>
          <div class="card">
            <img
              src="./src/img/casa_do_corte_website.png"
              alt=""
              class="card-img"
            />
            <a
              href="https://barbearia-casa-do-corte.vercel.app/"
              target="_blank"
              class="card-button"
              ><img
                src="./src/svg/arrow_outward_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
            /></a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
